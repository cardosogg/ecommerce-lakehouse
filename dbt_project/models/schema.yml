version: 2

models:
  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: silver_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: silver_sales
    columns:
      - name: sale_id
        tests:
          - unique
          - not_null

  - name: gold_sales_summary
    columns:
      - name: category
        tests:
          - unique
          - not_null